# SonarQube Cloud. The organization is not set here: .github/workflows/sonar.yml passes it from the
# SONAR_ORGANIZATION repository variable.
sonar.projectKey=KLTN-FA26_fe-storefront-stockflow-commerce
sonar.projectName=fe-storefront-stockflow-commerce
sonar.host.url=https://sonarcloud.io
sonar.sourceEncoding=UTF-8

sonar.sources=src
sonar.tests=src
sonar.test.inclusions=**/*.test.ts,**/*.test.tsx,**/__tests__/**,src/test/**

# Not analysed at all: the mock backend behind USE_MOCK=true, its fixtures, test doubles, generated
# or non-code files.
sonar.exclusions=**/__fixtures__/**,**/__mocks__/**,**/mock/**,**/mocks/**,src/lib/api/mock-*.ts,src/lib/api/mock-fixtures/**,src/lib/mock-data.ts,src/_design/**,**/*.d.ts,**/*.gen.ts,**/*.generated.*

# Not expected to carry coverage: tests, fixtures, mocks, type declarations, shadcn/ui primitives
# (generated into the repo) and App Router boilerplate. Keep in step with the --coverage.exclude
# flags in .github/workflows/sonar.yml.
sonar.coverage.exclusions=**/*.test.ts,**/*.test.tsx,**/*.spec.ts,**/*.spec.tsx,**/__tests__/**,**/__fixtures__/**,**/__mocks__/**,**/mock/**,**/mocks/**,src/test/**,src/lib/**/mock*,src/lib/**/mock*/**,**/*.d.ts,src/_design/**,src/components/ui/**,src/app/**/layout.tsx,src/app/**/loading.tsx,src/app/**/error.tsx,src/app/**/not-found.tsx

# Written by `pnpm run test:coverage` (vitest, v8 provider).
sonar.javascript.lcov.reportPaths=coverage/lcov.info
