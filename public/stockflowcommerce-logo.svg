  <title id="logoTitle">StockFlowCommerce logo</title>
  <desc id="logoDescription">A package flows through an S-shaped route into a forward arrow beside the StockFlow Commerce wordmark.</desc>

  <defs>
    <linearGradient id="sfcLogoIcon" x1="48" y1="45" x2="218" y2="220" gradientUnits="userSpaceOnUse">
      <stop stop-color="#0F766E"/>
      <stop offset="0.48" stop-color="#0891B2"/>
      <stop offset="1" stop-color="#2563EB"/>
    </linearGradient>
    <linearGradient id="sfcLogoWord" x1="444" y1="64" x2="646" y2="142" gradientUnits="userSpaceOnUse">
      <stop stop-color="#0891B2"/>
      <stop offset="1" stop-color="#2563EB"/>
    </linearGradient>
    <linearGradient id="sfcLogoFlow" x1="72" y1="71" x2="187" y2="207" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#E0F2FE"/>
    </linearGradient>
  </defs>

