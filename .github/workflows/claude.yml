# =============================================================================
# @claude theo yêu cầu. Nhắc @claude trong comment của PR hoặc issue, review comment, hoặc issue mới,
# Claude sẽ trả lời ngay tại đó - một câu hỏi hoặc một thay đổi code.
#
# Comment trên PR BẮT ĐẦU bằng "@claude review" không chạy ở đây mà ở claude-review.yml, để review lại
# đi đúng quy trình nhiều agent trong .github/claude/review-pr.md thay vì một lượt trò chuyện vài chục giây.
#
# Action tự từ chối người không có quyền write trên repo, nên comment từ bên ngoài không tiêu được token.
#
# Khác BE: repo này có hook trong .claude/settings.json chạy cả trong CI - sửa file thì
# format-changed-file gọi prettier, kết thúc lượt thì remind-validate bắt chạy `pnpm run validate`.
# Vì vậy phải cài node_modules trước, nếu không mọi lần @claude sửa code đều vấp hook.
# =============================================================================

name: claude

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  pull_request_review:
    types: [submitted]
  issues:
    types: [opened, assigned]

permissions:
  contents: read

jobs:
  claude:
    if: |
      (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@claude') &&
       !(github.event.issue.pull_request && startsWith(github.event.comment.body, '@claude review'))) ||
      (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review' && contains(github.event.review.body, '@claude')) ||
      (github.event_name == 'issues' && (contains(github.event.issue.body, '@claude') || contains(github.event.issue.title, '@claude')))
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      pull-requests: read
      issues: read
      id-token: write
      # Cho Claude đọc kết quả CI trên PR khi được hỏi vì sao build fail.
      actions: read

    steps:
      - uses: actions/checkout@v4
        with:
          # "@claude review" chạy git blame / git log trên các dòng bị sửa.
          fetch-depth: 0

      # ---------------------------------------------------------------------
      # Ngữ cảnh cho review, đặt trong .review-context/ (đã gitignore). Quy trình review (.github/claude/review-pr.md) tìm ở đây trước.
      # Giữ khối này giống hệt trong claude-review.yml.
      # ---------------------------------------------------------------------

      # Repo docs private, GITHUB_TOKEN không đọc được repo khác. Dùng fine-grained PAT chỉ cấp
      # Contents: Read-only cho riêng repo docs (org tắt deploy key nên không dùng được cách đó).
      # Thiếu token hoặc token hết hạn thì review vẫn chạy và nói rõ trong comment là đã bỏ qua
      # kiểm tra nghiệp vụ - một bước checkout hỏng không đáng làm mất cả lần review.
      - name: Checkout docs
        continue-on-error: true
        uses: actions/checkout@v4
        with:
          repository: KLTN-FA26/docs
          token: ${{ secrets.DOCS_READ_TOKEN }}
          path: .review-context/docs
          persist-credentials: false

      # BE public, nhánh develop là bản đang chạy (main tụt xa). Chỉ lấy phần review cần: mã Java
      # (enum status, DTO, controller - status và transition lấy BE làm chuẩn), migration (seed mã
      # quyền theo role) và i18n (thông báo lỗi). Bỏ fonts và dữ liệu demo.
      - name: Checkout BE
        continue-on-error: true
        uses: actions/checkout@v4
        with:
          repository: KLTN-FA26/be-backoffice-stockflow-commerce
          ref: develop
          path: .review-context/be
          sparse-checkout: |
            src/main/java
            src/main/resources/db/migration
            src/main/resources/i18n
          persist-credentials: false

      # SHA để comment link tới đúng phiên bản docs/BE đã đối chiếu.
      - name: Record context refs
        run: |
          for repo in docs be; do
            if [ -d ".review-context/$repo/.git" ]; then
              echo "$repo $(git -C ".review-context/$repo" rev-parse HEAD)"
            fi
          done > .review-context/refs.txt
          cat .review-context/refs.txt

      # Phiên bản pnpm lấy từ "packageManager" trong package.json - không khai báo lại ở đây.
      # Action bên thứ ba nên pin theo commit (v6.1.0).
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Pin theo commit: tag có thể bị dời sang code khác, mà bước này giữ token.
      # Bump cả hai workflow cùng lúc, trên cả develop và main, nếu không mọi lần chạy đều fail validation.
      - uses: anthropics/claude-code-action@5eb090f3c3afd701a0672cd32981197ca27688f6 # v1.0.253
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          additional_permissions: |
            actions: read
          # Ngữ cảnh docs/BE đã checkout sẵn ở trên - chỉ cho Claude biết chỗ để trả lời câu hỏi nghiệp
          # vụ/contract. Review đầy đủ không làm ở đây (xem đầu file).
          claude_args: |
            --append-system-prompt "Docs nghiệp vụ nằm ở .review-context/docs/docs, mã BE (develop) ở .review-context/be, SHA của hai repo ở .review-context/refs.txt. Nếu được nhờ review cả PR, nói người dùng comment một dòng bắt đầu bằng '@claude review' để chạy quy trình review đầy đủ. Trả lời bằng tiếng Việt."
            --allowedTools "Task,Agent,mcp__github_inline_comment__create_inline_comment,Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*),Bash(gh pr list:*),Bash(gh issue view:*),Bash(gh search:*),Bash(git diff:*),Bash(git log:*),Bash(git blame:*),Bash(pnpm run:*)"
