# =============================================================================
# CI. Chạy trên mỗi push vào main/dev và mỗi pull request (kể cả mỗi lần push thêm commit vào PR).
# Chép từ repo fe-backoffice-stockflow-commerce; khác duy nhất ở nhánh tích hợp (dev thay vì develop).
#
# Đây là bản tự động của mục "Verification" trong CLAUDE.md: typecheck, lint,
# test, build. Một check chỉ chạy khi có người nhớ ra thì không phải là check - ở đây nó chạy trên
# mọi commit, đỏ thì không merge.
#
# Tách 4 bước thay vì gọi `pnpm run validate` một lần: script đó nối bằng `&&` nên dừng ở lỗi đầu
# tiên, và log chỉ còn một bước "validate" đỏ - phải mở ra đọc mới biết hỏng ở đâu.
# =============================================================================

name: ci

on:
  push:
    branches: [main, dev]
  pull_request:

# Push mới lên cùng nhánh huỷ lần chạy trước - không để build của commit đã bị thay thế xếp hàng.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      # Phiên bản pnpm lấy từ "packageManager" trong package.json - không khai báo lại ở đây.
      # Action bên thứ ba nên pin theo commit (v6.1.0).
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Kiểu global của App Router (LayoutProps, PageProps...) được Next sinh vào .next/types. Máy
      # local có sẵn .next từ lần dev/build trước nên tsc pass; checkout mới trên CI thì không, và
      # tsc báo "Cannot find name 'LayoutProps'". Sinh type trước, không cần build.
      - name: Generate route types
        run: pnpm exec next typegen

      # Typecheck trước: lỗi type báo trong vài chục giây, không phải chờ build xong.
      - name: Typecheck
        run: pnpm run typecheck

      - name: Lint
        run: pnpm run lint

      - name: Test
        run: pnpm run test

      # Build cuối cùng, chậm nhất. Không cần .env: mọi biến server đều có giá trị mặc định
      # và chỉ được đọc lúc chạy, không phải lúc build.
      - name: Build
        run: pnpm run build
